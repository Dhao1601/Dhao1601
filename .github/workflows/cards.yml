name: Refresh profile cards
on:
  schedule:
    - cron: "17 0 * * *"   # daily, 07:17 Vietnam time
  workflow_dispatch:
  push:
    paths: ["data/projects.json", "scripts/**"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python scripts/render_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data/cache.json
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
